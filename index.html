<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>新概念英语课文阅读</title><style>
:root{--paper:#f7f4ed;--surface:#fffdf8;--ink:#172033;--muted:#667085;--line:#d9d4c8;--brand:#163a70;--accent:#b7791f;--shadow:0 18px 50px rgba(26,37,56,.12);--reader-size:20px}
